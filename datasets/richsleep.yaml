id: richsleep
name: RichSleep
description: >
  Overnight PSG from 24 healthy young adults (12 M / 12 F, aged 18-24),
  recorded at the Sleep and Neuroimaging Centre, Southwest University
  (Chongqing, China), with 18 signals including 6-channel EEG and hypnograms
  for each recording.
