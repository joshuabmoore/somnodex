id: surrey-ceegrid
name: Surrey cEEGrid sleep data set
short_name: Surrey cEEGrid
description: >
  Overnight recordings from 20 healthy adults at the Surrey Clinical Research
  Centre sleep laboratory (spring 2017), with around-the-ear EEG (cEEGrid
  flex-printed electrode arrays) recorded alongside standard PSG on the same
  night. Both the PSG and the cEEGrid recordings were manually sleep scored.
  Collected for a project on wearable sleep monitoring and released in BIDS.
