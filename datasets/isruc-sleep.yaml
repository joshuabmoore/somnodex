id: isruc-sleep
name: ISRUC-Sleep
short_name: ISRUC
description: >
  Whole-night PSG (~8 h) from adults at the Sleep Medicine Centre of the
  Hospital of Coimbra University (CHUC), Portugal, recorded 2009-2013. Three
  subgroups: (I) 100 subjects with sleep disorders, one session each; (II) 8
  subjects with sleep disorders, two sessions on different dates; (III) 10
  healthy controls, one session each. Every recording is scored independently
  by two experts under AASM rules, and both hypnograms are provided along with
  per-subject clinical details (diagnoses, medications, EEG alterations).
url: https://sleeptight.isr.uc.pt/
host: ISR, University of Coimbra
access: open
year_released: 2016
citations:
  - text: >
      Khalighi S, Sousa T, Santos JM, Nunes U. ISRUC-Sleep: A comprehensive
      public dataset for sleep researchers. Comput Methods Programs Biomed.
      2016;124:180-192.
    doi: 10.1016/j.cmpb.2015.10.013
  - text: >
      Khalighi S, Sousa T, Pires G, Nunes U. Automatic sleep staging: a computer
      assisted approach for optimal combination of features and polysomnographic
      channels. Expert Syst Appl. 2013;40(17):7046-7059.
population:
