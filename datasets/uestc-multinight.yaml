verified: false
date_added: 2026-10-15
last_checked: 2026-10-15
notes: >
  15 M / 5 F, age 24.95 ± 1.53 (range 22-29). Healthy, no psychiatric,
  neurological or sleep disorders; no alcohol, medication, caffeine, naps or
  strenuous exercise from 24 h before. Lights out about 23:30-08:30.
  Nights 1-2 recorded with an ICSMS amplifier (Chengdu) and night 3 with a
  Brain Products actiCHamp, so device differs within subject. EOG-R above the
  right outer canthus, EOG-L below the left; earlobe (A1) reference. Signals
  band-pass filtered 0.3-40 Hz (IIR Butterworth). AASM v2.4; the three
  scorers' hypnograms are released separately (no consensus). Spindles and
  slow waves were detected automatically (Luna) and provided as feature
  spreadsheets, not manual events. Zip with SLP001-SLP020, each with
  Day1-Day3 folders; 60 recordings is derived (20 x 3), the paper reports no
  missing nights. The OSF project licence is CC0 1.0; the article itself is
  CC BY-NC-ND 4.0. OSF project created Nov 2024; year_released uses the 2025
  paper. Download size not determined (OSF file API timed out). The id is
  coined here; the dataset has no official short name.
