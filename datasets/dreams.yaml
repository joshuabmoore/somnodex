notes: >
  One entry for the whole collection (a single Zenodo record, one license, one
  download page). Counts are the two whole-night staged sets: Subjects, 20
  healthy, medication-free volunteers chosen for few artifacts (4 M / 16 F,
  ages 20-65), and Patients, 27 patients (ages 19-74; SAHS, PLMS, dysomnia,
  insomnia, fibromyalgia, one unspecified). Treating these as 47 distinct people
  is inferred. Other databases: Artifacts (20 x 15 min excerpts, 1 expert),
  Spindles (8 x 30 min central EEG, 2 experts; expert 2 scored only the first 6,
  and expert 1's counts are cut off after 1000 s), K-complexes (the PDF lists 10
  x 30 min central EEG excerpts and says expert 2 scored only the first 5; the
  Zenodo page says 5 excerpts), REMs (9 x 30 min, 1 expert), PLMs (10 whole-night
  recordings, one tibialis EMG scored under ASDA criteria by 1 expert) and Apnea
  (12 whole-night recordings, AASM respiratory events by 1 expert). From ages,
  sexes and durations, most PLM recordings appear to be the same nights as
  Patients recordings (inferred). Staging was by a single expert: R&K in 20 s
  epochs and AASM, about two years later, in 30 s epochs; hypnogram text files
  hold one value per 5 s. Subjects/Patients recordings have at least 2 EOG
  (P8-A1, P18-A1), 3 EEG and chin EMG at 200 Hz; the Apnea set adds ECG, nasal
  airflow and thoracic/abdominal inductance; the PLM set adds 2 tibialis EMG;
  some excerpts are at 50 or 100 Hz. The micro-event sets also include automatic
  detections and a Matlab assessment algorithm. Files are RAR archives (4.3 GB
  in total; Subjects 1.1 GB, Patients 1.7 GB). Zenodo gives a nominal
  publication date of 2005-01-01 (record created 2019), so year_released is
  left out. Non-commercial, no-derivatives license.
