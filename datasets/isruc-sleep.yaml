  modalities: [eeg, eog, emg, ecg, respiratory, spo2, position]
  eeg_channels: 6
  eeg_montage: F3-A2, C3-A2, O1-A2, F4-A1, C4-A1, O2-A1
  sampling_rate_hz: 200
  nights_per_subject: "Subgroups I and III: 1; Subgroup II: 2 (different dates)"
annotations:
  staging: aasm
  epoch_s: 30
  n_scorers: 2
  events: []
formats: [edf+, txt, mat]
size_gb: 17.67
tags: [staging, clinical, benchmark, multi-scorer, longitudinal, medication]
verified: false
date_added: 2026-10-15
last_checked: 2026-10-15
notes: >
  Files are hosted on MEGA. No explicit license; the site says "publicly
  available for research purposes" and asks users to cite Khalighi et al. 2016. Raw recordings are EDF+ with a
  .REC extension; labels are text files with one line per epoch, with sex,
  height, weight, age and recording date in the header. Pre-extracted .mat
  channels are also provided (cite Khalighi et al. 2013); they drop the last 30
  epochs of each recording, so are 30 epochs shorter than the hypnograms.
  Download sizes: subgroup I 14.12 GB, II 2.2 GB, III 1.35 GB (raw recordings).
  The site's download page calls subgroup II healthy, but the paper and the
  site's home page say it had sleep disorders. Inter-scorer kappa: 0.87±0.09
  (I), 0.82±0.15 (II), 0.90±0.06 (III). 19 channels: 2 EOG, 6 EEG, chin EMG,
  ECG, 2 leg EMG, snore, 2 airflow, 2 abdominal effort, SaO2, body position;
  EEG/EOG/EMG/ECG at 200 Hz, others at 12.5-25 Hz.
