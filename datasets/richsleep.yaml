notes: >
  24 participants were selected from 37 volunteers as physically healthy with
  no sleep-related disorders, and avoided medication for 3 days beforehand.
  Recorded in a light-controlled room on sleep beds, sleep opportunity 10 pm to
  8 am, over 24 days. One night per subject and 24 recordings are inferred
  (24 subjects over 24 days); the page does not state it and the files list
  only shows one zip (RichSleep.zip, 3.85 GB). 18 signals: 6 EEG, EOG-L,
  EOG-R, chin EMG, ECG, respiratory, snore, leg movement, SpO2, CO2, chest and
  abdominal movement, breath interval; 200 Hz, impedance below 10 (stated as
  ohms; likely kOhm). Files: *xn.edf (PSG) and *xn-ann.txt (hypnograms with
  W, 1, 2, 3, R). The scoring standard and number of scorers are not stated,
  so staging is left unset; the 5-class labels suggest AASM, and a 30 s epoch
  is inferred. No descriptor paper is linked from the Mendeley page.
