id: hk1k
name: Helsinki Kids 1K
short_name: HK1K
description: >
  Routine clinical daytime EEG/ECG from 1032 children aged 2 months to 16
  years at Helsinki University Hospital (2011-2016), all with a normal EEG
  report and typical neurodevelopment confirmed over four years of follow-up.
  Each recording is a 15-minute segment around the onset of N2 sleep (5 min
  before, 10 min after), with 19-channel 10-20 EEG and one ECG channel.
  Intended as a normative paediatric reference for brain-age and ECG-age
  modelling and foundation-model pretraining.
