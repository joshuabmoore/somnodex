notes: >
  OpenNeuro ds005207 v1.0.0 (2024-06-01). 20 subjects (sub-001 ... sub-029,
  non-contiguous IDs), one night each; all 20 have a PSG recording and 19 have
  a cEEGrid recording (sub-012 is PSG only), so 39 EEG files in total. Each
  recording has its own manual 30-s hypnogram (PSG scoring and separate
  cEEGrid scoring, stages W/N1/N2/N3/REM plus artefact/movement/unscored
  codes); per the JSR paper scoring followed AASM and two technicians scored
  but only one scorer's hypnogram appears to be released (inferred from file
  names). PSG (SOMNOmedics SOMNO HD): 6 EEG at 128 Hz referenced to the
  contralateral mastoid, 3 EOG (128 Hz), 5 chin EMG derivations and ECG at
  256 Hz. cEEGrid: SMARTING (mBrainTrain) wireless amplifier at 250 Hz; the
  BIDS sidecar lists 15 EEG channels referenced to R4b plus 6 misc channels.
  Data are EEGLAB .set/.fdt; sourcedata holds the original PSG EDF, cEEGrid
  BDF/EDF, hypnogram text files and Actiwatch (.AWD) files. PSG and cEEGrid
  were not time-aligned at recording; derivatives/aligned1 gives the authors'
  best-effort aligned cEEGrid for 18 subjects. No demographics are released
  (participants.tsv has IDs only); the papers report the recruited 20 as aged
  34.9 +/- 13.8 years (8 M), and the analysed subsets as 15 (Sterr 2018) or
  12-15 recordings (Mikkelsen 2019) after losses and artefact exclusions. The
  BIDS sidecars name the University of Oxford Institute of Biomedical
  Engineering as institution, although recordings were made at Surrey. Size
  (69.1 GB) is from the NEMAR mirror listing. Recording type "other" denotes
  the cEEGrid ear-EEG.
