notes: >
  Recorded on a NicoletOne system with a Waveguard cap during routine
  out-patient clinical EEG after parent-instructed partial sleep deprivation
  (woken 2-4 h early). The 15-minute segment is anchored on N2 onset (first
  spindle or K-complex, AASM) as marked by an experienced EEG technician, but
  no hypnogram or onset annotation is distributed; by construction N2 onset is
  at 5 min. Other polygraphic channels (respiration, EMG, eye movements) were
  removed. Of 1056 screened recordings, 24 with zero-runs from impedance checks
  were dropped. Roughly 28 ECGs are too noisy for R-peak detection. Age and sex
  are in anon_codex_age_sex.csv; age is quantised into data-driven,
  roughly log-spaced bins of at least 10 children each, so the 0.17-year lower
  bound (2 months, from the paper) is approximate; the Zenodo description says
  6 months. Files: edf_files.zip (6.56 GB) and the CSV. MATLAB loader and
  analysis code: github.com/nstevensonUH/EEG_release_supporting_code. Creators
  are QIMR Berghofer and Helsinki University Hospital.
