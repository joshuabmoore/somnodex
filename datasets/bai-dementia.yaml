id: bai-dementia
name: Association of Sleep Electroencephalography-Based Brain Age Index With Dementia - Data and code
short_name: BAI-Dementia
description: >
  Data release for Ye et al. (2020, JAMA Network Open), which computed a sleep
  EEG brain age index (BAI) from clinical PSGs recorded at the Massachusetts
  General Hospital Sleep Laboratory in 2009-2017 and compared it across
  cognitive groups (healthy, non-dementia, symptomatic, MCI, dementia) in
  patients aged 50 and over. The release holds de-identified per-PSG BAI
  results, a PSG manifest with demographics, group labels and S3 paths to the
  staged signal files, cohort-assignment evidence (NLP-derived dementia flags,
  CDR/MMSE/MoCA scores), and analysis code.
