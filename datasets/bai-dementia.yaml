notes: >
  Published on BDSP 25 April 2026; data at
  s3://bdsp-opendata-credentialed/bai-dementia-sleep/, code at
  github.com/bdsp-core/bai-dementia. Access needs BDSP credentialing and the
  Credentialed Health Data Use Agreement, so it is not open. n_subjects is the
  paper's 5,144 patients included in BAI analyses (of 9,834 PSGs screened);
  5,144 is a patient count, not a PSG count. Counts in the release do not
  line up with the paper: bai_per_psg_deid.csv has about 2,864 PSGs,
  bai_psg_manifest.csv about 13,283 PSG files and cohort_v1_deid.csv about
  22,985 assessed PSGs, so n_recordings is left out. Group sizes per the BDSP
  page: 88 dementia, 44 MCI, 1,075 symptomatic, 3,024 non-dementia, of whom
  2,336 healthy; the paper's Table 1 gives 81 dementia patients (96 studies)
  and its Results text 2,336 for non-dementia. Paper: median age 54 (IQR
  43-65) and 3,026 men (59%); the IQR conflicts with the age >=50 rule, so
  these may describe a wider sample (unclear). The page does not say whether the staged signal files are raw EDF or
  derived, nor give channels, sampling rate or size; the EEG modality and lab
  setting are inferred from the paper (diagnostic, CPAP and split-night PSGs,
  clinically scored to AASM in 30 s epochs). The signals likely overlap with
  the Human Sleep Project (MGH) cohort, but the page does not say so. A
  companion BDSP release, "Dementia detection from brain activity during
  sleep" (10.60508/dysk-je18; 10,784 PSGs from 8,044 participants, features
  only, raw signals by separate request), and the open BAI model release
  (10.60508/et8c-2g96) are separate resources.
