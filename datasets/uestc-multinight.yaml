id: uestc-multinight
name: A Continuous Multi-night EEG Sleep Database
short_name: UESTC multi-night
description: >
  Three consecutive nights of sleep EEG from 20 healthy young adults recorded in
  the Brain Science and Sleep Laboratory at the University of Electronic Science
  and Technology of China (UESTC), Chengdu. Each night has 5 EEG, 2 EOG and chin
  EMG channels, with sleep stages scored independently by three physician
  experts from different sleep centres under AASM rules. Built for studying
  night-to-night sleep structure similarity and personalised closed-loop
  stimulation.
url: https://osf.io/gx36m/
doi: 10.17605/OSF.IO/GX36M
host: OSF
access: open
license: CC0-1.0
year_released: 2025
citations:
  - text: >
      Ying S, Fu J, Wang L, Zhang H, Yu Y, Wang H, Xie J, Liu T. A continuous
      multi-night sleep database for exploring sleep structure similarity. Sci
      Data. 2025;12:946.
    doi: 10.1038/s41597-025-05202-6
population:
  species: human
  n_subjects: 20
  n_recordings: 60
  age_range: [22, 29]
  groups: [healthy]
recording:
  type: [psg]
  setting: [lab]
  modalities: [eeg, eog, emg]
  eeg_channels: 5
  eeg_montage: F4-A1, C4-A1, FT8-A1, O2-A1, P4-A1
  sampling_rate_hz: 500
  nights_per_subject: "3 (consecutive)"
annotations:
  staging: aasm
  epoch_s: 30
  n_scorers: 3
  events: []
formats: [edf, csv, txt]
