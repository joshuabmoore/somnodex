id: hmc-sleep-staging
name: Haaglanden Medisch Centrum Sleep Staging Database
short_name: HMC
description: >
  Whole-night clinical PSG recordings collected in 2018 at the Haaglanden
  Medisch Centrum sleep centre (The Hague, Netherlands), randomly selected from
  adults referred for PSG for a range of sleep disorders. Recordings are a mix
  of in-hospital and ambulatory, and were manually scored by sleep technicians
  under the AASM Manual v2.4.
url: https://physionet.org/content/hmc-sleep-staging/
doi: 10.13026/t4w7-3k21
host: PhysioNet
access: open
license: CC-BY-4.0
year_released: 2021
citations:
  - text: >
      Alvarez-Estevez D, Rijsman R. Haaglanden Medisch Centrum sleep staging
      database (version 1.1). PhysioNet. 2022.
    doi: 10.13026/t79q-fr32
  - text: >
      Alvarez-Estevez D, Rijsman RM. Inter-database validation of a deep
      learning approach for automatic sleep scoring. PLoS One.
      2021;16(8):e0256111.
    doi: 10.1371/journal.pone.0256111
population:
