id: dreams
name: The DREAMS Databases
short_name: DREAMS
description: >
  Eight sleep databases from the DREAMS project (University of Mons TCTS Lab and
  ULB / CHU de Charleroi sleep laboratory, Belgium), recorded on a 32-channel
  Brainnet polygraph. Two are whole-night staging sets: Subjects (20 healthy
  adults) and Patients (27 patients with apnea, PLMS, insomnia and other
  conditions), each scored under both R&K and AASM. The rest are annotated
  excerpts or recordings for micro-event detection: artifacts, sleep spindles,
  K-complexes, rapid eye movements, periodic limb movements and apneas.
